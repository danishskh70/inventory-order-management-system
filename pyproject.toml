[project]
name = "ioms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Danish Shaikh", email = "danishskh70@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
ioms = "ioms:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
